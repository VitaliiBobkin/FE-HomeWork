<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TODO List</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<main>
  <h1 class="text-center mt-5 mb-5">TODO LIST</h1>
  <div class="container">
    <div class="row">

      <div class="col-4">
        <form id="todoForm">
          <div class="mb-3">
            <label class="form-label">Task title</label>
            <input
                    type="text"
                    name="title"
                    class="form-control"
                    placeholder="Title"
                    required
            >
          </div>
          <div class="mb-3">
            <label class="form-label">Task body</label>
            <textarea
                    name="description"
                    class="form-control"
                    placeholder="Task body"
                    cols="30"
                    rows="10"
                    required
            ></textarea>
          </div>
          <div class="d-flex justify-content-between">
            <div>
              <input
                      type="submit"
                      class="btn btn-primary"
                      value="Create Task!"
              >
              <input
                      type="reset"
                      value="Clear Form"
                      class="btn btn-warning"
              >
            </div>
            <button type="button" class="btn btn-danger remove-all">Delete All</button>
          </div>
        </form>
      </div>

      <div class="col-8">
        <div class="row" id="todoList"></div>
      </div>

    </div>
  </div>
</main>

  <!-- JS Files -->
  <script src="/src/js/controller/index.js"></script>
  <script src="/src/js/model/index.js"></script>
  <script src="/src/js/view/index.js"></script>
  <script src="/src/js/app.js"></script>
</body>
</html>
