<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Parser URL</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">
    <h1 class="text-center mb-4">To-Do List</h1>

    <div class="input-group mb-3">
        <input id="taskInput" type="text" class="form-control" placeholder="Enter a new task...">
        <button id="addBtn" class="btn btn-primary">Add</button>
    </div>

    <div class="btn-group mb-3" role="group">
        <button class="btn btn-outline-secondary active" data-filter="all">All</button>
        <button class="btn btn-outline-secondary" data-filter="active">Active</button>
        <button class="btn btn-outline-secondary" data-filter="completed">Completed</button>
    </div>
    <p>
        Completed: <span id="completedCount">0</span> |
        Active: <span id="activeCount">0</span>
    </p>
    <ul id="taskList" class="list-group"></ul>
  </div>
    <script src="./js/model/ToDoListModel.js"></script>
    <script src="./js/view/ToDoView.js"></script>
    <script src="./js/controller/ToDoListController.js"></script>
    <script src="./js/app.js"></script>
   </body>
</html>
